name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Python package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel, found {len(wheels)}")

          with ZipFile(wheels[0]) as wheel:
              files = set(wheel.namelist())

          required_files = {
              "endstone_discord/__init__.py",
              "endstone_discord/client.py",
              "endstone_discord/discord_plugin.py",
              "endstone_discord/config.toml",
          }
          missing = sorted(required_files - files)
          if missing:
              raise SystemExit(f"Wheel is missing required files: {missing}")

          if not any(path.endswith(".dist-info/entry_points.txt") for path in files):
              raise SystemExit("Wheel is missing its entry_points.txt file")

          print(f"Validated wheel: {wheels[0]}")
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as file:
              project_version = tomllib.load(file)["project"]["version"]

          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if tag_version != project_version:
              raise SystemExit(
                  f"Release tag v{tag_version} does not match "
                  f"pyproject.toml version {project_version}."
              )
          PY

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
